# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-frdm-imx93-security"
BBFILE_PATTERN_meta-frdm-imx93-security = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-frdm-imx93-security = "6"

LAYERDEPENDS_meta-frdm-imx93-security = "core"
LAYERSERIES_COMPAT_meta-frdm-imx93-security = "wrynose"
