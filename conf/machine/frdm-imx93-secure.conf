require conf/machine/imx93-11x11-lpddr4x-frdm.conf

# Makes the kernel artifacts available to the `linux-yocto-fitimage` recipe that builds the FIT image.
KERNEL_CLASSES += "kernel-fit-extra-artifacts"

# `frdm-imx93-secure.wks.in` refers to `fitImage` by file name and bitbake does
# not turn that into a dependency, so the task that deploys it is named here.
do_image_wic[depends] += "linux-yocto-fitimage:do_deploy"

# Enables FIT signing and embeds the public key into U-Boot's control device tree, marked as `required`.
UBOOT_SIGN_ENABLE  = "1"

# Tell the build where the signing key is and what it is called.
FIT_KEYS_DIR      ??= ""
UBOOT_SIGN_KEYDIR  ?= "${FIT_KEYS_DIR}"
UBOOT_SIGN_KEYNAME = "fit_signing_key"

# Uses RSA-4096 signatures, matching the key generated in the previous section.
FIT_SIGN_ALG = "rsa4096"

# Explicitly selects SHA-256 for image hashes.
FIT_HASH_ALG = "sha256"

# Signs FIT configurations rather than individual images, following U-Boot's recommended model.
FIT_SIGN_INDIVIDUAL = "0"

# Selects the custom partition layout we created for raw FIT image.
WKS_FILE = "frdm-imx93-secure.wks.in"

# The kernel inside the FIT is gzip compressed by the default setting in
# oe-core's `kernel-uboot.bbclass`. Unlike the settings above, this is a
# compression choice rather than a security setting. The value determines how
# the kernel is compressed at build time and is also used for the FIT kernel's
# `compression` property, which tells U-Boot how to decompress it. Keep the
# compression algorithm and file extension consistent.
#
# `kernel-uboot.bbclass` supports `gzip`, `lzma` and `lzo` for the FIT kernel,
# plus `none` to leave it uncompressed. `gzip` sits between the other two:
# `lzma` generally produces smaller images at the cost of slower decompression,
# while `lzo` generally decompresses faster but produces larger images.
# Evaluate the trade-off if boot time or storage usage becomes a priority.
#
FIT_KERNEL_COMP_ALG            = "gzip"
FIT_KERNEL_COMP_ALG_EXTENSION  = ".gz"

# The kernel load and entry addresses inside the FIT are not set here on purpose.
#
# These are RAM addresses, not storage offsets. The FIT is staged at 0x83000000,
# and `bootm` unpacks the compressed kernel out of it to the load address before
# transferring execution to the entry point.
#
# meta-freescale already defines the entry point for this SoC in
# `conf/machine/include/imx-base.inc`:
#
#   UBOOT_ENTRYPOINT:mx93-generic-bsp ?= "0x80400000"
#
# `UBOOT_LOADADDRESS` sets the load address. It has no machine override and only
# a weak default of `${UBOOT_ENTRYPOINT}` in `uboot-config.bbclass`. Setting both
# would therefore be unnecessary and could make the load and entry addresses
# diverge. We leave both unset and inherit the defaults so they stay consistent.

# Enable dm-verity image generation. The class builds the verity image and
# records the verity parameters, including the root hash, in an `.env` file.
IMAGE_CLASSES += "dm-verity-img"

# Select the image protected by dm-verity.
DM_VERITY_IMAGE = "imx-image-core"

# Select the filesystem image used as the dm-verity data area.
DM_VERITY_IMAGE_TYPE = "erofs-lz4hc"

# Append the hash tree to the filesystem image instead of using a separate
# hash partition. This is the class default, but it is set explicitly because
# the Wic layout in this part uses the appended form.
DM_VERITY_SEPARATE_HASH = "0"

# Select the initramfs that creates the dm-verity mapping before switching
# to the real root filesystem.
INITRAMFS_IMAGE = "dm-verity-image-initramfs"

# Keep the initramfs as a separate FIT ramdisk instead of bundling it into
# the kernel image.
INITRAMFS_IMAGE_BUNDLE = ""

# Build the initramfs as a gzip compressed cpio archive. This is the Yocto
# default, but it is set explicitly here to make the FIT ramdisk format clear.
# This is a compression choice, not a security setting.
INITRAMFS_FSTYPES = "cpio.gz"

# BitBake expands a `.wks.in` template before Wic sees it, so this is not
# needed here. A plain `.wks` is not expanded that way and would need every
# variable it references listed here.
#WICVARS:append = " IMX_BOOT_SEEK DM_VERITY_IMAGE DM_VERITY_IMAGE_TYPE IMAGE_NAME_SUFFIX"
