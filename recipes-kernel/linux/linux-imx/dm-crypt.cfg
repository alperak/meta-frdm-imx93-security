# Device Mapper is configured under the MD subsystem.
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y

# The initramfs opens the encrypted volume, so build dm-crypt into the kernel.
CONFIG_DM_CRYPT=y

# The LUKS2 volume is formatted with aes-xts-plain64. Keep the generic
# AES-XTS implementation as a fallback for the Armv8 Crypto Extensions one.
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_AES_ARM64_CE_BLK=y

# This design does not use encrypted or trusted keys, and the NXP defconfig
# ships CONFIG_TRUSTED_KEYS=m. Leaving either one at m would cap
# CONFIG_DM_CRYPT at m, so it could not be built into the kernel.
# CONFIG_ENCRYPTED_KEYS is not set
# CONFIG_TRUSTED_KEYS is not set
