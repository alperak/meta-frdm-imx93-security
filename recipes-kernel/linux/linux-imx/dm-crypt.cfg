# Device Mapper support.
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y

# The encrypted data volume is opened from the initramfs,
# so keep dm-crypt built into the kernel.
CONFIG_DM_CRYPT=y

# AES-XTS support used by the dm-crypt mapping. Keep the generic algorithms
# built in as well as the Armv8 Crypto Extensions implementation.
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_AES_ARM64_CE_BLK=y

# Allows cryptsetup to use the kernel keyring for the active LUKS2 volume key.
# The device derived unlock credential is not stored there.
CONFIG_KEYS=y

# This design does not use encrypted or trusted keys. Leaving either one at m
# would also prevent CONFIG_DM_CRYPT from becoming built-in.
# CONFIG_ENCRYPTED_KEYS is not set
# CONFIG_TRUSTED_KEYS is not set
